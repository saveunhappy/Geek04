<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>合同审查报告</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background: #f5f5f5; }
    .container { max-width: 960px; margin: 0 auto; background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; }
    .meta { color: #666; margin-bottom: 24px; }
    .score { font-size: 48px; font-weight: bold; color: #43a047; }
    table { width: 100%; border-collapse: collapse; margin-top: 24px; }
    th, td { border: 1px solid #e0e0e0; padding: 12px; text-align: left; vertical-align: top; }
    th { background: #fafafa; }
  </style>
</head>
<body>
  <div class="container">
    <h1>合同审查报告</h1>
    <div class="meta">文件：sample-contract.txt</div>
    <div class="score">总体评分：A</div>
    <div class="meta">高风险 0 处 / 中风险 0 处 / 低风险 0 处</div>
    <table>
      <thead>
        <tr><th>等级</th><th>类型</th><th>条款</th><th>原文</th><th>建议</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</body>
</html>
